<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bet Hedge & Cutting Calculator | CalcWorld</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{font-family:Arial,sans-serif;background:#f6f7fb;margin:0}
header{background:#fff;padding:16px 24px;box-shadow:0 2px 4px rgba(0,0,0,.05)}
header a{text-decoration:none;color:#2563eb;font-size:22px;font-weight:bold}

.container{
  max-width:650px;margin:40px auto;background:#fff;padding:24px;
  border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.08)
}
h2{margin-top:0}

input,select{
  width:100%;padding:8px;font-size:15px;border-radius:6px;border:1px solid #ccc;margin-top:4px;
}

.bet-row{display:flex;gap:10px;margin-top:12px;align-items:center}
.bet-team{flex:1}
.bet-stake{flex:1}
.bet-odds{flex:1}

.remove{
  width:32px;height:38px;display:flex;align-items:center;justify-content:center;
  background:#ffe5e5;border:1px solid #f3b9b9;border-radius:6px;cursor:pointer;
  color:#dc2626;font-size:18px;font-weight:bold;
}
.remove:hover{background:#ffcccc}

button{
  margin-top:16px;width:100%;padding:12px;font-size:17px;
  background:#2563eb;color:#fff;border:none;border-radius:8px;cursor:pointer
}
button:hover{opacity:.9}

small{display:block;margin-top:4px;color:#666;font-size:13px}

.result{margin-top:24px;background:#eef4ff;padding:18px;border-radius:10px}
.green{color:#16a34a;font-weight:bold}
.red{color:#dc2626;font-weight:bold}

.disclaimer{
  margin-top:22px;background:#fffbee;border-left:4px solid #fbbf24;
  padding:12px 14px;border-radius:8px;font-size:14px;color:#7a6100
}
</style>
</head>

<body>
<header><a href="/">CalcWorld</a></header>

<div class="container">
<h2>Bet Hedge & Cutting Calculator</h2>

<label>How many outcomes?</label>
<select id="mode" onchange="resetAll()">
  <option value="2">2 — Team A & Team B</option>
  <option value="3">3 — Team A, Team B & Draw</option>
</select>

<label style="margin-top:14px">Team Names</label>
<div style="display:flex;gap:10px">
  <input id="teamA" value="Team A">
  <input id="teamB" value="Team B">
</div>
<div id="drawBox" style="display:none;margin-top:10px">
  <input id="teamD" value="Draw">
</div>

<label style="margin-top:16px">Place Your Bets</label>
<div id="betsArea"></div>

<small>💰 Max stake per bet: ₹10,00,000</small>
<small>🍒 Decimal odds allowed: 1.01 to 16</small>

<button onclick="addRow()">+ Add More Bet</button>
<button onclick="calc()">Calculate Bets</button>

<div id="output" class="result" style="display:none"></div>

<div class="disclaimer">
⚠️ <strong>Disclaimer:</strong> This tool is for educational purposes only. Betting involves financial risk and can be addictive. CalcWorld does not encourage or support gambling.
</div>

</div>

<script>
let outcomes=['A','B'];

function resetAll(){
  const mode = document.getElementById('mode').value;
  outcomes = mode==='2' ? ['A','B'] : ['A','B','D'];

  document.getElementById('drawBox').style.display = mode==='3' ? 'block' : 'none';

  document.getElementById('betsArea').innerHTML='';
  addRow();
  calc();
}

function addRow(){
  const row=document.createElement('div');
  row.className='bet-row';

  const sel=document.createElement('select');
  sel.className='bet-team';
  outcomes.forEach(o=>sel.add(new Option(getName(o),o)));

  const stake=document.createElement('input');
  stake.className='bet-stake';
  stake.type='number'; stake.min='1'; stake.max='1000000'; stake.value='100';

  const odds=document.createElement('input');
  odds.className='bet-odds';
  odds.type='number'; odds.min='1.01'; odds.max='16'; odds.step='0.01'; odds.value='2.00';

  const del=document.createElement('div');
  del.className='remove'; del.textContent='✖';
  del.onclick=()=>{row.remove();calc();};

  sel.oninput=calc; stake.oninput=limitStake; odds.oninput=limitOdds; odds.onchange=calc;

  row.append(sel,stake,odds,del);
  document.getElementById('betsArea').append(row);
}

function getName(t){
  if(t==='A') return document.getElementById('teamA').value || 'Team A';
  if(t==='B') return document.getElementById('teamB').value || 'Team B';
  return document.getElementById('teamD').value || 'Draw';
}

function limitStake(){ if(this.value>1000000) this.value=1000000; calc(); }
function limitOdds(){ if(this.value>16) this.value=16; calc(); }

function calc(){
  const rows=document.querySelectorAll('.bet-row');
  if(rows.length===0){output.style.display='none';return;}

  let winA=0,winB=0,winD=0;
  let stakeA=0,stakeB=0,stakeD=0;
  let total=0;

  rows.forEach(r=>{
    const team=r.children[0].value;
    const stake=+r.children[1].value;
    const odds=+r.children[2].value;
    if(!stake||!odds) return;
    total+=stake;
    const profit = stake*(odds-1);

    if(team==='A'){winA+=profit; stakeB+=stake; stakeD+=stake;}
    if(team==='B'){winB+=profit; stakeA+=stake; stakeD+=stake;}
    if(team==='D'){winD+=profit; stakeA+=stake; stakeB+=stake;}
  });

  winA-=stakeA; winB-=stakeB; winD-=stakeD;

  const mode=document.getElementById('mode').value;

  let html=`<p><strong>Total stake placed:</strong> ₹${total}</p>`;
  html+=`<p><strong>If ${getName('A')} wins:</strong> ${fmt(winA)}</p>`;
  html+=`<p><strong>If ${getName('B')} wins:</strong> ${fmt(winB)}</p>`;
  if(mode==='3') html+=`<p><strong>If ${getName('D')} happens:</strong> ${fmt(winD)}</p>`;

  output.innerHTML=html;
  output.style.display='block';
}

function fmt(n){
  const r=Math.round(n);
  return r>=0?`<span class="green">₹${r}</span>`:`<span class="red">₹${r}</span>`;
}

resetAll();
</script>

</body>
</html>
