<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scientific Calculator | CalcWorld</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{font-family:Arial;background:#111;margin:0;display:flex;justify-content:center;padding:20px}
.calc{background:#1c1c1c;width:360px;padding:20px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.display{background:#000;color:#fff;font-size:32px;text-align:right;padding:15px;border-radius:12px;height:60px;overflow-x:auto}
.preview{color:#8af4a0;font-size:18px;text-align:right;margin-top:4px;height:20px}
.keys{margin-top:16px;display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.btn{background:#2e2e2e;color:white;border:none;border-radius:12px;font-size:18px;padding:16px;cursor:pointer}
.op{background:#ff9500}
.eq{background:#34c759}
.mem{background:#444}
.mode{background:#007aff}
.btn.inv-active{background:#0a84ff}
.btn:hover{opacity:.85}
.history{margin-top:18px;background:#222;color:white;padding:10px;border-radius:10px;max-height:120px;overflow-y:auto;font-size:14px}
.history p{margin:4px 0;cursor:pointer}
</style>
</head>

<body>
<div class="calc">
  <div id="disp" class="display"></div>
  <div id="preview" class="preview"></div>

  <div id="modeRow" style="display:flex;gap:6px;margin:8px 0;">
    <button class="btn mode" id="degRad" onclick="toggleDegRad()">DEG</button>
    <button class="btn mode" id="invBtn" onclick="toggleInv()">INV</button>
  </div>

  <div class="keys">
    <button class="btn mem" onclick="memClear()">MC</button>
    <button class="btn mem" onclick="memRecall()">MR</button>
    <button class="btn mem" onclick="memAdd()">M+</button>
    <button class="btn mem" onclick="memSub()">M-</button>
    <button class="btn" onclick="clearAll()">AC</button>

    <button class="btn" onclick="inputFunc('(')">(</button>
    <button class="btn" onclick="inputFunc(')')">)</button>
    <button class="btn" onclick="scientific('pow')">xʸ</button>
    <button class="btn op" onclick="inputFunc('%')">%</button>
    <button class="btn" onclick="backspace()">⌫</button>

    <button class="btn func" onclick="doTrig('sin')">sin</button>
    <button class="btn func" onclick="doTrig('cos')">cos</button>
    <button class="btn func" onclick="doTrig('tan')">tan</button>
    <button class="btn func" onclick="scientific('log')">log</button>
    <button class="btn func" onclick="scientific('ln')">ln</button>

    <button class="btn" onclick="scientific('sqrt')">√</button>
    <button class="btn" onclick="scientific('pow2')">x²</button>
    <button class="btn" onclick="scientific('pow3')">x³</button>
    <button class="btn" onclick="scientific('inv')">1/x</button>
    <button class="btn" onclick="scientific('exp10')">10ˣ</button>

    <button class="btn" onclick="inputFunc('7')">7</button>
    <button class="btn" onclick="inputFunc('8')">8</button>
    <button class="btn" onclick="inputFunc('9')">9</button>
    <button class="btn op" onclick="inputFunc('/')">÷</button>
    <button class="btn op" onclick="inputFunc('*')">×</button>

    <button class="btn" onclick="inputFunc('4')">4</button>
    <button class="btn" onclick="inputFunc('5')">5</button>
    <button class="btn" onclick="inputFunc('6')">6</button>
    <button class="btn op" onclick="inputFunc('-')">−</button>
    <button class="btn op" onclick="inputFunc('+')">+</button>

    <button class="btn" onclick="inputFunc('1')">1</button>
    <button class="btn" onclick="inputFunc('2')">2</button>
    <button class="btn" onclick="inputFunc('3')">3</button>
    <button class="btn" onclick="inputFunc('.')">.</button>
    <button class="btn eq" onclick="calculate()">=</button>

    <button class="btn" onclick="inputFunc('0')" style="grid-column:span 3">0</button>
    <button class="btn func" onclick="inputFunc(Math.PI)">π</button>
    <button class="btn func" onclick="inputFunc(Math.E)">e</button>
  </div>

  <div id="history" class="history"></div>
</div>

<script>
let disp=document.getElementById('disp');
let preview=document.getElementById('preview');
let historyBox=document.getElementById('history');
let history=[];
let memory=0;
let degMode=true;
let invMode=false;

// Input helpers
function inputFunc(v){ disp.textContent+=v; liveEval(); }
function backspace(){ disp.textContent=disp.textContent.slice(0,-1); liveEval();}
function clearAll(){ disp.textContent=''; preview.textContent=''; }

// Memory
function memClear(){memory=0;}
function memRecall(){disp.textContent+=memory;liveEval();}
function memAdd(){memory+=Number(evalSafe(disp.textContent)||0);}
function memSub(){memory-=Number(evalSafe(disp.textContent)||0);}

// DEG/RAD + INV toggles
function toggleDegRad(){
  degMode=!degMode;
  document.getElementById('degRad').textContent=degMode?'DEG':'RAD';
}
function toggleInv(){
  invMode=!invMode;
  document.getElementById('invBtn').classList.toggle('inv-active');
}

// Safe math parser with ^
function evalSafe(expr){
  try{
    expr = expr.replace(/\^/g,'**');
    return Function(`"use strict";return (${expr})`)();
  }catch{return null;}
}

// Scientific
function scientific(type){
  let x=evalSafe(disp.textContent);
  if(x===null)return;

  switch(type){
    case 'sqrt': x=Math.sqrt(x);break;
    case 'pow2': x=x**2;break;
    case 'pow3': x=x**3;break;
    case 'inv': x=1/x;break;
    case 'log': x=Math.log10(x);break;
    case 'ln': x=Math.log(x);break;
    case 'exp10': x=Math.pow(10,x);break;
    case 'pow': disp.textContent+='^'; return;
  }
  disp.textContent=x;
  liveEval();
}

// Trig + INV + deg/rad
function doTrig(fn){
  let x=evalSafe(disp.textContent);
  if(x===null)return;
  if(degMode) x=(x*Math.PI)/180;

  if(!invMode){
    if(fn==='sin') x=Math.sin(x);
    if(fn==='cos') x=Math.cos(x);
    if(fn==='tan') x=Math.tan(x);
  }else{
    if(fn==='sin') x=Math.asin(x);
    if(fn==='cos') x=Math.acos(x);
    if(fn==='tan') x=Math.atan(x);
    if(degMode) x=x*180/Math.PI;
  }
  disp.textContent=x;
  liveEval();
}

// Preview & eval
function liveEval(){
  let v=evalSafe(disp.textContent);
  preview.textContent=(v===null?'':v);
}

function calculate(){
  let v=evalSafe(disp.textContent);
  if(v===null)return;
  preview.textContent='';
  disp.textContent=v;
  history.unshift(v);
  renderHistory();
}

// History
function renderHistory(){
  historyBox.innerHTML='';
  history.slice(0,10).forEach(h=>{
    let p=document.createElement('p');
    p.textContent=h;
    p.onclick=()=>{disp.textContent=h;liveEval();}
    historyBox.append(p);
  });
}

// Keyboard
document.addEventListener('keydown',e=>{
  if(/[0-9+\-*/().]/.test(e.key))inputFunc(e.key);
  if(e.key==='Enter')calculate();
  if(e.key==='Backspace')backspace();
});
</script>

</body>
</html>
